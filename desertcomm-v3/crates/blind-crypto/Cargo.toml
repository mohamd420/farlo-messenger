[package]
name = "blind-crypto"
version = "3.1.0"
edition = "2021"

[dependencies]
blake3.workspace = true
zeroize.workspace = true
thiserror.workspace = true
snow = "0.9"
chacha20poly1305 = "0.10"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
bip39 = "2.1"
num-bigint = "0.4"