[workspace]
resolver = "2"
members = [
    "crates/framing-clock-core",
    "crates/blind-crypto",
    "crates/fec-interleaver",
    "crates/rf-channel-sim",
    "crates/dsp-modem",
    "crates/neural-squeeze",
    "crates/dtn-router",
    "crates/desertcomm-ffi",
]

[workspace.dependencies]
blake3 = "1.5"
siphasher = "1.0"
zeroize = { version = "1.8", features = ["derive"] }
thiserror = "2.0"